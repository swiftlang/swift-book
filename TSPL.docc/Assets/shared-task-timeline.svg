<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Timeline with four lanes: Thread, the first call to image(for: 1234), the shared download Task, and the second call to image(for: 1234). The second call reenters, finds the task already recorded, and awaits that same task instead of starting its own download — so only one download runs, and both calls resume once it resolves.">

  <rect x="0.75" y="0.75" width="998.5" height="328.5" rx="14" fill="#101214" stroke="#24272A" stroke-width="1.5"/>

  <!-- Legend -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#8B9096">
    <rect x="120" y="22" width="16" height="16" rx="3" fill="#5C6166"/>
    <text x="144" y="34">Running — holds the thread</text>

    <rect x="400" y="22" width="16" height="16" rx="3" fill="url(#hatch-neutral)"/>
    <text x="424" y="34">Suspended — off-thread work</text>

    <rect x="680" y="22" width="16" height="16" rx="3" fill="#3A3E42" stroke="#24272A" stroke-width="1.2"/>
    <text x="704" y="34">Thread free</text>
  </g>

  <!-- Full-height guides at every state transition, faint -->
  <g stroke="#1B1D1F" stroke-width="1">
    <line x1="276" y1="90" x2="276" y2="294"/>
    <line x1="367" y1="90" x2="367" y2="294"/>
    <line x1="580" y1="90" x2="580" y2="294"/>
  </g>
  <!-- Panel title -->
  <text x="40" y="90" font-family="Instrument Sans, ui-sans-serif, sans-serif" font-weight="600" font-size="16" fill="#2BB6A3">ImageLoader</text>

  <!-- ===== Thread lane ===== -->
  <text x="40" y="120" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#C6CACD">Thread</text>
  <rect x="200" y="104" width="760" height="24" rx="5" fill="#3A3E42" stroke="#24272A" stroke-width="1.2"/>
  <rect x="200" y="104" width="76" height="24" rx="4" fill="#E2703A"/>
  <rect x="314" y="104" width="53" height="24" rx="4" fill="#4C97DD"/>
  <rect x="504" y="104" width="76" height="24" rx="4" fill="#E2703A"/>
  <rect x="580" y="104" width="76" height="24" rx="4" fill="#4C97DD"/>

  <!-- ===== gap 1: first call's ticks ===== -->
  <text x="206" y="146" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" font-size="9.5" fill="#E2703A">① miss</text>
  <line x1="276" y1="128" x2="276" y2="152" stroke="#2BB6A3" stroke-width="1.6"/>
  <line x1="504" y1="128" x2="504" y2="152" stroke="#8B9096" stroke-width="1"/>
  <text x="510" y="146" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#8B9096">⑥ writes .ready(image)</text>

  <!-- ===== Call 1 lane: image(for:) "1234" ===== -->
  <text x="40" y="171" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#E2703A">image(for:)</text>
  <text x="40" y="184" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5C6166">"1234"</text>
  <rect x="200" y="152" width="760" height="30" rx="6" fill="#16181A"/>
  <rect x="200" y="152" width="76" height="30" rx="4" fill="#E2703A"/>
  <rect x="276" y="152" width="228" height="30" fill="url(#hatch-coral)"/>
  <rect x="504" y="152" width="76" height="30" rx="4" fill="#E2703A"/>
  <text x="590" y="171" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#8B9096">done</text>

  <!-- ===== gap between Call 1 and Task: created marker ===== -->
  <line x1="276" y1="182" x2="276" y2="200" stroke="#2BB6A3" stroke-width="1.2"/>
  <text x="282" y="196" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#2BB6A3">② records .inProgress, starts download</text>

  <!-- ===== Task lane: shared download ===== -->
  <text x="40" y="216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#2BB6A3">downloadImage(for:)</text>
  <rect x="200" y="200" width="760" height="24" rx="5" fill="#16181A"/>
  <rect x="276" y="200" width="228" height="24" rx="4" fill="#2BB6A3"/>
  <text x="510" y="216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#2BB6A3">⑤ network responds</text>

  <!-- ===== gap 2: second call's ticks ===== -->
  <line x1="367" y1="224" x2="367" y2="248" stroke="#2BB6A3" stroke-width="1.6"/>
  <text x="373" y="242" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" font-size="9.5" fill="#2BB6A3">④ sees task, awaits it</text>
  <line x1="580" y1="224" x2="580" y2="248" stroke="#8B9096" stroke-width="1"/>
  <text x="586" y="242" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" fill="#8B9096">⑦ same image — 1 network call</text>

  <!-- ===== Call 2 lane: image(for:) "1234" ===== -->
  <text x="40" y="267" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#4C97DD">image(for:)</text>
  <text x="40" y="280" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#5C6166">"1234"</text>
  <rect x="200" y="248" width="760" height="30" rx="6" fill="#16181A"/>
  <rect x="314" y="248" width="53" height="30" rx="4" fill="#4C97DD"/>
  <rect x="367" y="248" width="213" height="30" fill="url(#hatch-blue)"/>
  <rect x="580" y="248" width="76" height="30" rx="4" fill="#4C97DD"/>
  <text x="666" y="267" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#8B9096">done</text>

  <!-- Emphasis, drawn last so it paints on top of every lane it crosses -->
  <line x1="504" y1="90" x2="504" y2="294" stroke="#2BB6A3" stroke-width="1.6"/>
  <line x1="314" y1="72" x2="314" y2="232" stroke="#4C97DD" stroke-width="2.5"/>
  <polygon points="306,232 322,232 314,241" fill="#4C97DD"/>
  <rect x="231" y="44" width="166" height="24" rx="12" fill="#4C97DD"/>
  <text x="314" y="60" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" font-size="11.5" fill="#08090A">③ ↩ Call 2 reenters</text>

  <!-- Axis -->
  <line x1="200" y1="294" x2="954" y2="294" stroke="#3A3E42" stroke-width="1.2" marker-end="url(#axisArrow)"/>
  <text x="960" y="298" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#5C6166">time</text>

  <defs>
    <marker id="axisArrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3A3E42"/>
    </marker>

    <pattern id="hatch-coral" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#E2703A" fill-opacity="0.16"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#E2703A" stroke-width="2.4"/>
    </pattern>
    <pattern id="hatch-blue" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#4C97DD" fill-opacity="0.16"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4C97DD" stroke-width="2.4"/>
    </pattern>
    <pattern id="hatch-neutral" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#8B9096" fill-opacity="0.18"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8B9096" stroke-width="2.4"/>
    </pattern>
  </defs>
</svg>
